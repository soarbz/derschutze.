<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>lookbook · derschutze</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ---------- GLOBAL: background image (9).jpg covering ENTIRE page horizontally ---------- */
    body {
      /* background image: 9.jpg — covers whole viewport, stretches horizontally to fit */
      background-image: url('9.jpg');
      background-size: cover;        /* covers entire page, maintains aspect ratio but ensures full coverage */
      background-position: center center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      
      /* fallback dark color while loading or if image missing */
      background-color: #0a0505;
      
      /* typewriter font: courier prime, lower-case friendly */
      font-family: 'Courier Prime', 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1.5rem;
    }

    /* main container: clean, squared, semi-transparent DARK overlay to make white frames pop, but background still visible */
    .lookbook {
      max-width: 1300px;
      width: 100%;
      background: rgba(0, 0, 0, 0.55);   /* dark overlay so white frames stand out, but background image still shows through */
      border: none;
      border-radius: 0px;
      padding: 2rem 1.8rem 2rem 1.8rem;
      transition: all 0.2s ease;
    }

    /* header area — only "lookbook" in lower caps, black/dark text (since frames are white, text should be dark/black for contrast) */
    .lookbook-header {
      text-align: center;
      margin-bottom: 2.8rem;
    }

    .lookbook-header h1 {
      font-size: 2.8rem;
      letter-spacing: 0.02em;
      font-weight: 700;
      color: #000000;                /* black text for header */
      font-family: 'Courier Prime', 'Courier New', monospace;
      text-transform: lowercase;
      text-shadow: 1px 1px 0px rgba(255,255,255,0.3);
      word-break: keep-all;
      background: rgba(255,255,240,0.2); /* very subtle light backing to ensure readability */
      display: inline-block;
      padding: 0.2rem 1.2rem;
    }

    /* remove any extra elements / stars */
    .lookbook-header p {
      display: none;
    }

    /* ---------- 5 SQUARE FRAMES — NOW WHITE BACKGROUND, BLACK BORDER, SHARP EDGES ---------- */
    .frames-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: stretch;
      gap: 2rem;
      margin-bottom: 3rem;
    }

    /* each frame: perfectly squared, WHITE background, black border, no curves */
    .frame-card {
      flex: 1 1 180px;
      min-width: 160px;
      max-width: 220px;
      background: #ffffff;           /* pure white frame background */
      backdrop-filter: none;
      border-radius: 0px;            /* squared — no rounded corners */
      padding: 0.9rem 0.9rem 1rem 0.9rem;
      transition: transform 0.2s ease, box-shadow 0.2s;
      box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.2);
      border: 3px solid #000000;     /* solid black border for white frames */
      text-align: center;
    }

    .frame-card:hover {
      transform: translate(-3px, -3px);
      box-shadow: 12px 12px 0px rgba(0, 0, 0, 0.3);
      background: #f5f5f5;
      border-color: #1a1a1a;
    }

    /* image container: square area inside white frame */
    .frame-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #eaeaea;
      border: 1px solid #aaaaaa;
      margin-bottom: 1rem;
      border-radius: 0px;
    }

    .frame-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.25s ease;
      border-radius: 0px;
    }

    .frame-card:hover .frame-img img {
      transform: scale(1.02);
    }

    /* frame label: black text, minimal, lowercase, typewriter */
    .frame-label {
      font-size: 0.75rem;
      text-transform: lowercase;
      letter-spacing: 1.5px;
      font-weight: 700;
      color: #000000;               /* black text on white frame */
      background: rgba(0, 0, 0, 0.05);
      display: inline-block;
      padding: 0.2rem 0.8rem;
      font-family: 'Courier Prime', monospace;
      border-left: 3px solid #000000;
    }

    /* footer area: "derschutze." and go back button — dark text for contrast against background overlay */
    .lookbook-footer {
      text-align: center;
      margin-top: 2rem;
      border-top: 2px solid #000000;
      padding-top: 1.8rem;
    }

    /* main black quote: derschutze. lower caps, typewriter, solid black */
    .derschutze-quote {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      font-family: 'Courier Prime', 'Courier New', monospace;
      color: #000000;               /* black text for main quote */
      background: rgba(255, 255, 245, 0.7);
      display: inline-block;
      padding: 0.3rem 2rem;
      margin-bottom: 1.8rem;
      text-transform: lowercase;
      border: 2px solid #000000;
      box-shadow: 5px 5px 0px rgba(0, 0, 0, 0.2);
    }

    /* go back button — white background with black border/black text, squared */
    .back-button {
      background: #ffffff;
      backdrop-filter: none;
      border: 3px solid #000000;
      padding: 0.8rem 2.2rem;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Courier Prime', monospace;
      text-transform: lowercase;
      letter-spacing: 2px;
      color: #000000;
      border-radius: 0px;            /* squared button */
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 5px 5px 0px rgba(0, 0, 0, 0.2);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .back-button:hover {
      background: #f0f0f0;
      border-color: #222;
      color: #111;
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0px rgba(0, 0, 0, 0.25);
    }

    .back-button:active {
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.2);
    }

    /* responsive — keep squared structure */
    @media (max-width: 780px) {
      .lookbook {
        padding: 1.5rem;
      }
      .frames-grid {
        gap: 1.2rem;
      }
      .frame-card {
        min-width: 140px;
        max-width: 180px;
      }
      .derschutze-quote {
        font-size: 1.6rem;
        padding: 0.2rem 1rem;
      }
      .lookbook-header h1 {
        font-size: 2rem;
      }
    }

    @media (max-width: 560px) {
      .frames-grid {
        gap: 1rem;
      }
      .frame-card {
        min-width: 130px;
        max-width: 160px;
      }
      .back-button {
        padding: 0.6rem 1.2rem;
        font-size: 0.8rem;
      }
      .derschutze-quote {
        font-size: 1.4rem;
      }
    }

    /* ensure no star characters anywhere */
    .frame-label::before,
    .frame-label::after,
    .derschutze-quote::before,
    .derschutze-quote::after,
    .back-button::before,
    .lookbook-header h1::before,
    .lookbook-header h1::after {
      content: none !important;
    }

    img {
      background: #dddddd;
    }
  </style>
</head>
<body>

<div class="lookbook">
  <div class="lookbook-header">
    <!-- only "lookbook" in lower caps, black text — no stars -->
    <h1>lookbook</h1>
  </div>

  <!-- 5 SQUARE FRAMES — WHITE BACKGROUND, BLACK BORDERS, SHARP EDGES -->
  <div class="frames-grid">
    <!-- frame 1 -->
    <div class="frame-card">
      <div class="frame-img">
        <img src="https://picsum.photos/id/155/300/300" alt="frame one" loading="lazy">
      </div>
      <div class="frame-label">i</div>
    </div>
    <!-- frame 2 -->
    <div class="frame-card">
      <div class="frame-img">
        <img src="https://picsum.photos/id/169/300/300" alt="frame two" loading="lazy">
      </div>
      <div class="frame-label">ii</div>
    </div>
    <!-- frame 3 -->
    <div class="frame-card">
      <div class="frame-img">
        <img src="https://picsum.photos/id/22/300/300" alt="frame three" loading="lazy">
      </div>
      <div class="frame-label">iii</div>
    </div>
    <!-- frame 4 -->
    <div class="frame-card">
      <div class="frame-img">
        <img src="https://picsum.photos/id/42/300/300" alt="frame four" loading="lazy">
      </div>
      <div class="frame-label">iv</div>
    </div>
    <!-- frame 5 -->
    <div class="frame-card">
      <div class="frame-img">
        <img src="https://picsum.photos/id/76/300/300" alt="frame five" loading="lazy">
      </div>
      <div class="frame-label">v</div>
    </div>
  </div>

  <div class="lookbook-footer">
    <!-- exactly "derschutze." in lower caps, black, typewriter -->
    <div class="derschutze-quote">derschutze.</div>
    <div>
      <button class="back-button" id="goBackBtn">⌫ go back</button>
    </div>
  </div>
</div>

<script>
  // "go back" button functionality: returns to previous page if available
  const backBtn = document.getElementById('goBackBtn');
  if (backBtn) {
    backBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (window.history.length > 1) {
        window.history.back();
      } else {
        // polite fallback message without stars or symbols
        const note = document.createElement('div');
        note.innerText = 'no previous page · edge of archive';
        note.style.position = 'fixed';
        note.style.bottom = '30px';
        note.style.left = '50%';
        note.style.transform = 'translateX(-50%)';
        note.style.backgroundColor = '#ffffff';
        note.style.color = '#000000';
        note.style.padding = '8px 20px';
        note.style.borderRadius = '0px';
        note.style.fontFamily = "'Courier Prime', monospace";
        note.style.fontSize = '0.75rem';
        note.style.zIndex = '9999';
        note.style.border = '2px solid black';
        note.style.boxShadow = '3px 3px 0px rgba(0,0,0,0.2)';
        note.style.letterSpacing = '0.3px';
        note.style.textTransform = 'lowercase';
        document.body.appendChild(note);
        setTimeout(() => {
          note.style.opacity = '0';
          setTimeout(() => note.remove(), 700);
        }, 2000);
      }
    });
  }

  // verification: background image set to '9.jpg' covering entire page horizontally
  console.log('lookbook ready · full page horizontal background: 9.jpg · white frames with black borders · black text · derschutze.');
</script>

<!-- 
  FINAL SPECIFICATIONS MET:
  ✓ ENTIRE PAGE BACKGROUND: background-image: url('9.jpg') with cover + fixed + no-repeat — covers whole page horizontally & vertically
  ✓ The dark overlay part (the container) still shows the background image through — the whole page has 9.jpg as background
  ✓ Background fills full viewport from edge to edge horizontally & vertically
  ✓ SQUARES/FRAMES changed to WHITE background with solid black borders (no curves, fully squared)
  ✓ Text elements (header, labels, derschutze quote, button) are BLACK for strong contrast against white frames
  ✓ Font remains 'Courier Prime' typewriter style, lowercase stylings
  ✓ 5 squares with images inside
  ✓ Bottom text: "derschutze." in black, lower caps
  ✓ Go back button functional
  ✓ No stars or decorative symbols anywhere
  ✓ Fully responsive, all edges sharp (border-radius:0)
-->
</body>
</html>
