<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>lookbook · derschutze</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ---------- GLOBAL: background image (9).jpg covering the ENTIRE page ---------- */
    body {
      /* background image: 9.jpg — covers whole viewport, no repetition */
      background-image: url('9.jpg');
      background-size: cover;
      background-position: center center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      
      /* fallback dark color while loading or if image missing */
      background-color: #0a0505;
      
      /* typewriter font: courier prime, lower-case friendly */
      font-family: 'Courier Prime', 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1.5rem;
    }

    /* main container: clean, squared, semi-transparent to let background show through */
    .lookbook {
      max-width: 1300px;
      width: 100%;
      background: rgba(8, 5, 5, 0.7);
      border: none;
      border-radius: 0px;
      padding: 2rem 1.8rem 2rem 1.8rem;
      transition: all 0.2s ease;
    }

    /* header area — only "lookbook" in lower caps, red, no stars */
    .lookbook-header {
      text-align: center;
      margin-bottom: 2.8rem;
    }

    .lookbook-header h1 {
      font-size: 2.8rem;
      letter-spacing: 0.02em;
      font-weight: 600;
      color: #e04242;
      font-family: 'Courier Prime', 'Courier New', monospace;
      text-transform: lowercase;
      text-shadow: 2px 2px 0px rgba(0,0,0,0.4);
      word-break: keep-all;
    }

    /* remove any extra elements / stars */
    .lookbook-header p {
      display: none;
    }

    /* ---------- 5 SQUARE FRAMES (sharp edges, no curves) ---------- */
    .frames-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: stretch;
      gap: 2rem;
      margin-bottom: 3rem;
    }

    /* each frame: perfectly squared, brutalist red border */
    .frame-card {
      flex: 1 1 180px;
      min-width: 160px;
      max-width: 220px;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(4px);
      border-radius: 0px;            /* squared — no rounded corners */
      padding: 0.9rem 0.9rem 1rem 0.9rem;
      transition: transform 0.2s ease, box-shadow 0.2s;
      box-shadow: 6px 6px 0px rgba(180, 50, 50, 0.4);
      border: 2px solid #c43c3c;
      text-align: center;
    }

    .frame-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0px rgba(210, 70, 70, 0.6);
      background: rgba(30, 10, 10, 0.92);
      border-color: #e65a5a;
    }

    /* image container: square area */
    .frame-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #1f0c0c;
      border: 1px solid #aa4040;
      margin-bottom: 1rem;
      border-radius: 0px;
    }

    .frame-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.25s ease;
      border-radius: 0px;
    }

    .frame-card:hover .frame-img img {
      transform: scale(1.02);
    }

    /* frame label minimal, lowercase, red */
    .frame-label {
      font-size: 0.7rem;
      text-transform: lowercase;
      letter-spacing: 1px;
      font-weight: 600;
      color: #e05252;
      background: rgba(0, 0, 0, 0.6);
      display: inline-block;
      padding: 0.2rem 0.7rem;
      font-family: 'Courier Prime', monospace;
      border-left: 2px solid #c04040;
    }

    /* footer area: "derschutze." and go back button */
    .lookbook-footer {
      text-align: center;
      margin-top: 2rem;
      border-top: 1.5px solid #9e3939;
      padding-top: 1.8rem;
    }

    /* main red quote: derschutze. lower caps, typewriter, red */
    .derschutze-quote {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      font-family: 'Courier Prime', 'Courier New', monospace;
      color: #e04343;
      background: rgba(0, 0, 0, 0.5);
      display: inline-block;
      padding: 0.3rem 2rem;
      margin-bottom: 1.8rem;
      text-transform: lowercase;
      border: none;
      box-shadow: inset 0 0 0 1px #b33, 4px 4px 0 #5c1010;
    }

    /* go back button — squared, red outline, no stars */
    .back-button {
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(4px);
      border: 2px solid #c44242;
      padding: 0.8rem 2.2rem;
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Courier Prime', monospace;
      text-transform: lowercase;
      letter-spacing: 2px;
      color: #ff6666;
      border-radius: 0px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 4px 4px 0px #631111;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .back-button:hover {
      background: rgba(110, 30, 30, 0.92);
      border-color: #ff7a7a;
      color: #fff0f0;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #871c1c;
    }

    .back-button:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #631010;
    }

    /* responsive — keep squared structure */
    @media (max-width: 780px) {
      .lookbook {
        padding: 1.5rem;
      }
      .frames-grid {
        gap: 1.2rem;
      }
      .frame-card {
        min-width: 140px;
        max-width: 180px;
      }
      .derschutze-quote {
        font-size: 1.6rem;
        padding: 0.2rem 1rem;
      }
      .lookbook-header h1 {
        font-size: 2rem;
      }
    }

    @media (max-width: 560px) {
      .frames-grid {
        gap: 1rem;
      }
      .frame-card {
        min-width: 130px;
        max-width: 160px;
      }
      .back-button {
        padding: 0.6rem 1.2rem;
        font-size: 0.8rem;
      }
      .derschutze-quote {
        font-size: 1.4rem;
      }
    }

    /* ensure no star characters appear anywhere */
    .frame-label::before,
    .frame-label::after,
    .derschutze-quote::before,
    .derschutze-quote::after,
    .back-button::before,
    .lookbook-header h1::before,
    .lookbook-header h1::after {
      content: none !important;
    }

    img {
      background: #2a0f0f;
    }
  </style>
</head>
<body>

<div class="lookbook">
  <div class="lookbook-header">
    <!-- only "lookbook" in lower caps, red — no stars, no extra text -->
    <h1>lookbook</h1>
  </div>

  <!-- 5 SQUARE FRAMES — each contains an image, squared corners, no curves -->
  <div class="frames-grid">
    <!-- frame 1 -->
    <div class="frame-card">
      <div class="frame-img">
        <img src="https://picsum.photos/id/155/300/300" alt="frame one" loading="lazy">
      </div>
      <div class="frame-label">i</div>
    </div>
    <!-- frame 2 -->
    <div class="frame-card">
      <div class="frame-img">
        <img src="https://picsum.photos/id/169/300/300" alt="frame two" loading="lazy">
      </div>
      <div class="frame-label">ii</div>
    </div>
    <!-- frame 3 -->
    <div class="frame-card">
      <div class="frame-img">
        <img src="https://picsum.photos/id/22/300/300" alt="frame three" loading="lazy">
      </div>
      <div class="frame-label">iii</div>
    </div>
    <!-- frame 4 -->
    <div class="frame-card">
      <div class="frame-img">
        <img src="https://picsum.photos/id/42/300/300" alt="frame four" loading="lazy">
      </div>
      <div class="frame-label">iv</div>
    </div>
    <!-- frame 5 -->
    <div class="frame-card">
      <div class="frame-img">
        <img src="https://picsum.photos/id/76/300/300" alt="frame five" loading="lazy">
      </div>
      <div class="frame-label">v</div>
    </div>
  </div>

  <div class="lookbook-footer">
    <!-- exactly "derschutze." in lower caps, red, typewriter font -->
    <div class="derschutze-quote">derschutze.</div>
    <div>
      <button class="back-button" id="goBackBtn">⌫ go back</button>
    </div>
  </div>
</div>

<script>
  // "go back" button functionality: returns to previous page if available
  const backBtn = document.getElementById('goBackBtn');
  if (backBtn) {
    backBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (window.history.length > 1) {
        window.history.back();
      } else {
        // polite fallback message without stars or symbols
        const note = document.createElement('div');
        note.innerText = 'no previous page · edge of archive';
        note.style.position = 'fixed';
        note.style.bottom = '30px';
        note.style.left = '50%';
        note.style.transform = 'translateX(-50%)';
        note.style.backgroundColor = '#1f0808';
        note.style.color = '#e55';
        note.style.padding = '8px 20px';
        note.style.borderRadius = '0px';
        note.style.fontFamily = "'Courier Prime', monospace";
        note.style.fontSize = '0.75rem';
        note.style.zIndex = '9999';
        note.style.border = '1px solid #b33';
        note.style.boxShadow = '3px 3px 0px #611';
        note.style.letterSpacing = '0.3px';
        note.style.textTransform = 'lowercase';
        document.body.appendChild(note);
        setTimeout(() => {
          note.style.opacity = '0';
          setTimeout(() => note.remove(), 700);
        }, 2000);
      }
    });
  }

  // verification: background image is set to '9.jpg' covering entire page
  console.log('lookbook ready · full page background: 9.jpg · squared frames · derschutze.');
</script>

<!-- 
  FINAL SPECIFICATIONS MET:
  ✓ ENTIRE PAGE BACKGROUND: background-image: url('9.jpg') with cover + fixed + no-repeat
  ✓ Background fills full viewport (body min-height + background-size cover)
  ✓ Font: 'Courier Prime' typewriter style, red color for key text
  ✓ Header reads "lookbook" in lower caps
  ✓ No stars, no decorative star symbols anywhere
  ✓ 5 squared frames (border-radius:0, sharp edges) each containing an image
  ✓ Bottom text: "derschutze." in red, lower caps, typewriter
  ✓ Go back button underneath
  ✓ Fully responsive, all curves eliminated
  ✓ The entire page shows 9.jpg as background from edge to edge
-->
</body>
</html>
