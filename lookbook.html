<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>YAMIZAKURA · lookbook collection</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ---------- GLOBAL: background image (9).jpg covering ENTIRE page ---------- */
    body {
      background-image: url('9.jpg');
      background-size: cover;
      background-position: center center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      background-color: #0a0505;
      font-family: 'Courier Prime', 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1.5rem;
    }

    /* main container: dark overlay to make red frames pop */
    .lookbook {
      max-width: 1500px;
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      border: none;
      border-radius: 0px;
      padding: 2rem 2rem 2rem 2rem;
    }

    /* header area — exactly "FULL YAMIZAKURA COLLECTION" */
    .lookbook-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .lookbook-header h1 {
      font-size: 2rem;
      letter-spacing: 0.03em;
      font-weight: 700;
      color: #ffffff;
      font-family: 'Courier Prime', 'Courier New', monospace;
      text-transform: uppercase;
      text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
      background: rgba(0, 0, 0, 0.5);
      display: inline-block;
      padding: 0.5rem 2rem;
      border: 2px solid #cc3333;
    }

    /* main wrapper that holds both sidebar and grid */
    .collection-wrapper {
      display: flex;
      gap: 2rem;
      margin-bottom: 3rem;
      flex-wrap: wrap;
    }

    /* LEFT SIDEBAR - ENLARGED, no text, just image */
    .left-sidebar {
      flex: 1.2;
      min-width: 300px;
      max-width: 420px;
      background: #cc2222;
      border: 3px solid #000000;
      box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.4);
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      align-self: stretch;
      transition: transform 0.2s ease, box-shadow 0.2s;
    }

    .left-sidebar:hover {
      transform: translate(-3px, -3px);
      box-shadow: 12px 12px 0px rgba(0, 0, 0, 0.5);
      background: #dd3a3a;
    }

    .sidebar-img {
      width: 100%;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      border: 2px solid #000000;
      background: #2a0a0a;
    }

    .sidebar-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .left-sidebar:hover .sidebar-img img {
      transform: scale(1.02);
    }

    /* remove text - no sidebar-text element anymore */

    /* ---------- GRID: 8 items exactly as reference ---------- */
    .frames-grid {
      flex: 3;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.8rem;
    }

    /* each frame: RED background, black border, sharp edges, product card style */
    .frame-card {
      background: #cc2222;
      border-radius: 0px;
      padding: 1.2rem 1rem 1.2rem 1rem;
      transition: transform 0.2s ease, box-shadow 0.2s, background 0.2s;
      box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.35);
      border: 3px solid #000000;
      text-align: center;
      display: flex;
      flex-direction: column;
      cursor: default;
    }

    .frame-card:hover {
      transform: translate(-3px, -3px);
      box-shadow: 10px 10px 0px rgba(0, 0, 0, 0.45);
      background: #dd3a3a;
      border-color: #111;
    }

    /* image container: square area with border */
    .frame-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #2a0a0a;
      border: 2px solid #000000;
      margin-bottom: 1rem;
    }

    .frame-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.25s ease;
    }

    .frame-card:hover .frame-img img {
      transform: scale(1.02);
    }

    /* product name styling — all caps, bold, white */
    .product-title {
      font-family: 'Courier Prime', monospace;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #ffffff;
      margin: 0.5rem 0 0.3rem 0;
      line-height: 1.3;
      word-break: break-word;
    }

    /* price styling with yen symbol */
    .product-price {
      font-family: 'Courier Prime', monospace;
      font-size: 0.9rem;
      font-weight: 700;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.45);
      display: inline-block;
      padding: 0.2rem 0.8rem;
      margin-top: 0.3rem;
      border: 1px solid #ffffff;
      letter-spacing: 0.5px;
    }

    /* subtle index label */
    .frame-label {
      font-size: 0.6rem;
      text-transform: lowercase;
      letter-spacing: 1px;
      font-weight: 500;
      color: #ffcccc;
      background: rgba(0, 0, 0, 0.4);
      display: inline-block;
      padding: 0.15rem 0.6rem;
      margin-top: 0.5rem;
      font-family: 'Courier Prime', monospace;
    }

    /* footer area with "CLOSE WINDOW" button */
    .lookbook-footer {
      text-align: center;
      margin-top: 0.5rem;
      border-top: 2px solid #cc3333;
      padding-top: 2rem;
    }

    .close-window-btn {
      background: #cc2222;
      border: 3px solid #000000;
      padding: 0.9rem 2.5rem;
      font-size: 1.1rem;
      font-weight: 700;
      font-family: 'Courier Prime', monospace;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #ffffff;
      border-radius: 0px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 5px 5px 0px rgba(0, 0, 0, 0.35);
      display: inline-block;
    }

    .close-window-btn:hover {
      background: #dd3a3a;
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0px rgba(0, 0, 0, 0.4);
    }

    .close-window-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.3);
    }

    /* derschutze text at bottom */
    .signature {
      text-align: center;
      margin-top: 1.8rem;
      font-size: 0.8rem;
      color: #ffffff;
      font-family: 'Courier Prime', monospace;
      text-transform: lowercase;
      letter-spacing: 1px;
      opacity: 0.7;
    }

    /* responsive: tablet & mobile */
    @media (max-width: 1100px) {
      .collection-wrapper {
        flex-direction: column;
      }
      .left-sidebar {
        max-width: 100%;
        flex-direction: row;
        align-items: center;
        gap: 1.5rem;
      }
      .sidebar-img {
        max-width: 280px;
        aspect-ratio: 1 / 1;
      }
      .frames-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 1.5rem;
      }
    }

    @media (max-width: 700px) {
      .frames-grid {
        grid-template-columns: 1fr;
        gap: 1.2rem;
      }
      .left-sidebar {
        flex-direction: column;
      }
      .sidebar-img {
        max-width: 100%;
      }
      .lookbook-header h1 {
        font-size: 1.2rem;
      }
    }

    @media (max-width: 550px) {
      .lookbook {
        padding: 1.2rem;
      }
      .close-window-btn {
        padding: 0.6rem 1.5rem;
        font-size: 0.9rem;
      }
    }

    /* no unwanted chars */
    .frame-label::before,
    .frame-label::after,
    .close-window-btn::before,
    .close-window-btn::after {
      content: none !important;
    }

    img {
      background: #2a1111;
    }
  </style>
</head>
<body>

<div class="lookbook">
  <div class="lookbook-header">
    <h1>FULL YAMIZAKURA COLLECTION</h1>
  </div>

  <div class="collection-wrapper">
    <!-- LEFT SIDEBAR - ENLARGED FRAME with only picture (no text, just image) -->
    <div class="left-sidebar">
      <div class="sidebar-img">
        <img src="https://picsum.photos/id/104/800/1000" alt="editorial" loading="lazy" onerror="this.src='https://picsum.photos/id/119/800/1000'">
      </div>
    </div>

    <!-- 8 product frames exactly matching the screenshot data -->
    <div class="frames-grid">
      <!-- 1. KIMONO JACKET - ¥26,800 -->
      <div class="frame-card">
        <div class="frame-img">
          <img src="processed_thangka_release_lookbook_20.avif" alt="KIMONO JACKET" loading="lazy" onerror="this.onerror=null; this.src='https://picsum.photos/id/30/300/300'; this.alt='fallback image'">
        </div>
        <div class="product-title">KIMONO JACKET</div>
        <div class="product-price">¥26,800</div>
        <div class="frame-label">i</div>
      </div>

      <!-- 2. MARGIELA ZUKO - ¥39,900 -->
      <div class="frame-card">
        <div class="frame-img">
          <img src="processed_thangka_release_lookbook_29.avif" alt="MARGIELA ZUKO" loading="lazy" onerror="this.onerror=null; this.src='https://picsum.photos/id/31/300/300'">
        </div>
        <div class="product-title">MARGIELA ZUKO</div>
        <div class="product-price">¥39,900</div>
        <div class="frame-label">ii</div>
      </div>

      <!-- 3. THE FIRE - ¥7,800 -->
      <div class="frame-card">
        <div class="frame-img">
          <img src="processed_thangka_release_lookbook_37.webp" alt="THE FIRE" loading="lazy" onerror="this.onerror=null; this.src='https://picsum.photos/id/32/300/300'; this.alt='fallback image'">
        </div>
        <div class="product-title">THE FIRE</div>
        <div class="product-price">¥7,800</div>
        <div class="frame-label">iii</div>
      </div>

      <!-- 4. YAMKUKARUKA BAG - ¥22,500 -->
      <div class="frame-card">
        <div class="frame-img">
          <img src="processed_thangka_release_lookbook_28.avif" alt="YAMKUKARUKA BAG" loading="lazy" onerror="this.onerror=null; this.src='https://picsum.photos/id/33/300/300'; this.alt='fallback image'">
        </div>
        <div class="product-title">YAMKUKARUKA BAG</div>
        <div class="product-price">¥22,500</div>
        <div class="frame-label">iv</div>
      </div>

      <!-- 5. OBI BELT - ¥12,400 -->
      <div class="frame-card">
        <div class="frame-img">
          <img src="2024-11-13-1-2-1-2-3.webp" alt="OBI BELT" loading="lazy" onerror="this.onerror=null; this.src='https://picsum.photos/id/34/300/300'; this.alt='fallback image'">
        </div>
        <div class="product-title">OBI BELT</div>
        <div class="product-price">¥12,400</div>
        <div class="frame-label">v</div>
      </div>

      <!-- 6. DARK TOTE - ¥9,200 -->
      <div class="frame-card">
        <div class="frame-img">
          <img src="processed_thangka_release_lookbook_22.webp" alt="DARK TOTE" loading="lazy" onerror="this.onerror=null; this.src='https://picsum.photos/id/35/300/300'; this.alt='fallback image'">
        </div>
        <div class="product-title">DARK TOTE</div>
        <div class="product-price">¥9,200</div>
        <div class="frame-label">vi</div>
      </div>

      <!-- 7. SAKURA PANTS (formerly GLOVES) - ¥6,500 with processed_thangka_release_lookbook_25.avif -->
      <div class="frame-card">
        <div class="frame-img">
          <img src="processed_thangka_release_lookbook_25.avif" alt="SAKURA PANTS" loading="lazy" onerror="this.onerror=null; this.src='https://picsum.photos/id/36/300/300'; this.alt='fallback image'">
        </div>
        <div class="product-title">SAKURA PANTS</div>
        <div class="product-price">¥6,500</div>
        <div class="frame-label">vii</div>
      </div>

      <!-- 8. SCARF - ¥5,800 -->
      <div class="frame-card">
        <div class="frame-img">
          <img src="https://picsum.photos/id/37/300/300" alt="SCARF" loading="lazy">
        </div>
        <div class="product-title">SCARF</div>
        <div class="product-price">¥5,800</div>
        <div class="frame-label">viii</div>
      </div>
    </div>
  </div>

  <div class="lookbook-footer">
    <button class="close-window-btn" id="closeWindowBtn">CLOSE WINDOW</button>
    <div class="signature">derschutze.</div>
  </div>
</div>

<script>
  // CLOSE WINDOW functionality: goes back in history or shows gentle fallback
  const closeBtn = document.getElementById('closeWindowBtn');
  if (closeBtn) {
    closeBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (window.history.length > 1) {
        window.history.back();
      } else {
        const toast = document.createElement('div');
        toast.innerText = 'no previous page — end of collection';
        toast.style.position = 'fixed';
        toast.style.bottom = '30px';
        toast.style.left = '50%';
        toast.style.transform = 'translateX(-50%)';
        toast.style.backgroundColor = '#cc2222';
        toast.style.color = '#ffffff';
        toast.style.padding = '8px 20px';
        toast.style.borderRadius = '0px';
        toast.style.fontFamily = "'Courier Prime', monospace";
        toast.style.fontSize = '0.75rem';
        toast.style.border = '2px solid black';
        toast.style.boxShadow = '3px 3px 0px rgba(0,0,0,0.3)';
        toast.style.zIndex = '9999';
        toast.style.letterSpacing = '0.5px';
        document.body.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          setTimeout(() => toast.remove(), 800);
        }, 2000);
      }
    });
  }

  console.log('YAMIZAKURA COLLECTION · Left editorial frame: text removed, image enlarged · GLOVES → SAKURA PANTS with processed_thangka_release_lookbook_25.avif');
</script>

</html>
